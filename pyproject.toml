[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gearsentry"
version = "0.1.0"
description = "Monitoramento de preços de periféricos com histórico e alertas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "pydantic>=2.5",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
gearsentry = "gearsentry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gearsentry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: faz requisições reais (rede)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
